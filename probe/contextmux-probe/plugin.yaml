name: contextmux-probe
version: "0.1.0"
description: >-
  ContextMux Phase 1B probe. Registers llm_request middleware and appends one
  sanitized structural record per outbound LLM request to
  $HERMES_HOME/logs/contextmux-probe.jsonl. Lengths and digests only: message
  content, prompt text, tool arguments, and credentials are never persisted.
author: ContextMux Phase 1B
kind: standalone
provides_middleware:
  - llm_request
optional_env:
  - CONTEXTMUX_PROBE_MODE
  - CONTEXTMUX_MUTATE_MARKER
tags:
  - contextmux
  - probe
  - diagnostics